<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Digital Tools Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --primary: #fbbf24;
            --primary-hover: #f59e0b;
            --bg: #090d16;
            --card-bg: rgba(22, 28, 45, 0.8);
            --card-border: rgba(251, 191, 36, 0.15);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 50px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        .error-glow {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.08) 0%, transparent 60%);
            pointer-events: none;
        }
        .error-code {
            font-size: 100px;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #fbbf24, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }
        .error-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
        }
        .error-desc {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 35px;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #000;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(251, 191, 36, 0.5);
        }
    </style>
</head>
<body>
<div class="error-card">
        <div class="error-glow"></div>
        <div class="error-code">404</div>
        <h1 class="error-title" id="err-title">Page Not Found</h1>
        <p class="error-desc" id="err-desc">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="/" class="btn-home" id="err-btn">
            <i class="fas fa-home"></i> <span id="err-btn-text">Back to Home</span>
        </a>
    </div>

    <script>
        const lang = localStorage.getItem('rcs_lang') || 'en';
        const translations = {
            en: {
                title: "Page Not Found",
                desc: "The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.",
                btn: "Back to Home"
            },
            gu: {
                title: "પૃષ્ઠ મળ્યું નથી",
                desc: "તમે જે પૃષ્ઠ શોધી રહ્યા છો તે કદાach કાઢી નાખવામાં આવ્યું છે, તેનું નામ બદલાયું છે અથવા તે અસ્થાયી રૂપે અપ્રાપ્ય છે.",
                btn: "ડેશબોર્ડ પર પાછા જાઓ"
            },
            hi: {
                title: "पृष्ठ नहीं मिला",
                desc: "आप जिस पृष्ठ की तलाश कर रहे हैं उसे शायद हटा दिया गया है, उसका नाम बदल दिया गया है, या वह अस्थायी रूप से अनुपलब्ध है।",
                btn: "होम पेज पर वापस जाएं"
            }
        };

        const t = translations[lang] || translations['en'];
        document.getElementById('err-title').textContent = t.title;
        document.getElementById('err-desc').textContent = t.desc;
        document.getElementById('err-btn-text').textContent = t.btn;
    </script>
</body>
</html>
